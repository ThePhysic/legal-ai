name: local-product-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run python scripts/verify_corpus.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run ruff check api evaluations tests scripts
      - run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - run: uv run pytest -q
      - run: uv run python -m evaluations --help
      - run: uv run alembic -c migrations/alembic.ini upgrade head
      - run: uv export --no-dev --no-emit-project --format requirements-txt --output-file /tmp/legal-ai-requirements.txt
      - run: uv run pip-audit --no-deps --disable-pip -r /tmp/legal-ai-requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  integrated-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run python scripts/bootstrap.py
      - run: docker compose up -d --build --wait
      - run: uv run python scripts/container_smoke.py --app-url http://127.0.0.1:3000 --api-url http://127.0.0.1:8000
      - run: node scripts/browser-check.mjs
        env:
          LEGAL_AI_BASE_URL: http://127.0.0.1:3000
          LEGAL_AI_API_URL: http://127.0.0.1:8000
          LEGAL_AI_BROWSER_PATH: /usr/bin/google-chrome
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-integration-evidence
          path: artifacts/
      - run: docker compose down
        if: always()
