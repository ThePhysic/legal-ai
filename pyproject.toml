[project]
name = "legal-ai"
version = "0.1.0"
description = "Offline grounded legal research and encrypted document intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn==0.42.0",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.48",
  "alembic==1.18.4",
  "cryptography==50.0.2",
  "python-multipart==0.0.31",
  "pypdf==6.21.4",
  "python-docx==1.2.0",
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "pinecone==10.3.0",
  "psycopg[binary]==3.3.3",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7", "pip-audit>=2.10,<3"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "tests/evaluation"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "evaluations"]
